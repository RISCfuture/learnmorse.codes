<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Page Not Found — Learn Morse Code</title>
    <meta name="description" content="There is no page at this address." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icon-pinned-tab.svg" color="black" />

    <!-- The zone's CSP grants 'unsafe-inline' to `style-src-attr` alone, so a
         `<style>` element here would be blocked and the page would render
         unstyled. The stylesheet is a sibling file that Vite copies out of
         `public/` under a stable, unhashed name. -->
    <link rel="stylesheet" href="/404.css" />
  </head>

  <body>
    <main>
      <!-- Each mark carries the unit at which it goes on air in a `--morse-start`
           custom property; `404.css` turns that into the mark's phase within one
           shared transmission cycle. -->
      <div aria-hidden="true" class="signal">
        <span class="marks">
          <span class="mark dit" style="--morse-start: 0"></span>
          <span class="mark dit" style="--morse-start: 2"></span>
          <span class="mark dit" style="--morse-start: 4"></span>
          <span class="mark dit" style="--morse-start: 6"></span>
          <span class="mark dah" style="--morse-start: 8"></span>
        </span>

        <span class="marks">
          <span class="mark dah" style="--morse-start: 14"></span>
          <span class="mark dah" style="--morse-start: 18"></span>
          <span class="mark dah" style="--morse-start: 22"></span>
          <span class="mark dah" style="--morse-start: 26"></span>
          <span class="mark dah" style="--morse-start: 30"></span>
        </span>

        <span class="marks">
          <span class="mark dit" style="--morse-start: 36"></span>
          <span class="mark dit" style="--morse-start: 38"></span>
          <span class="mark dit" style="--morse-start: 40"></span>
          <span class="mark dit" style="--morse-start: 42"></span>
          <span class="mark dah" style="--morse-start: 44"></span>
        </span>
      </div>

      <h1>
        <span class="code">404</span>
        <span class="label">Page not found</span>
      </h1>

      <p class="lede">This address doesn’t decode to anything.</p>

      <p><a class="button" href="/">Back to the lessons</a></p>
    </main>
  </body>
</html>
